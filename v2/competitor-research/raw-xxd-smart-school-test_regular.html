    <script>
      // 动态设定根节点的fontSize，即rem的基数
      var Dpr = 1,
        uAgent = window.navigator.userAgent;
      var isIOS = uAgent.match(/iphone/i);
      var isYIXIN = uAgent.match(/yixin/i);
      var is2345 = uAgent.match(/Mb2345/i);
      var ishaosou = uAgent.match(/mso_app/i);
      var isSogou = uAgent.match(/sogoumobilebrowser/gi);
      var isLiebao = uAgent.match(/liebaofast/i);
      var isGnbr = uAgent.match(/GNBR/i);
      var wFsize, wDpr;
      function isMobile(ua) {
        var ua = ua || "";
        return (
          ua.match(/Android/i) ||
          ua.match(/webOS/i) ||
          ua.match(/iPhone/i) ||
          ua.match(/iPad/i) ||
          ua.match(/iPod/i) ||
          ua.match(/BlackBerry/i) ||
          ua.match(/Windows Phone/i)
        );
      }
      function resizeRoot() {
        var wWidth =
          screen.width > 0
            ? window.innerWidth >= screen.width || window.innerWidth == 0
              ? screen.width
              : window.innerWidth
            : window.innerWidth;
        var wHeight =
          screen.height > 0
            ? window.innerHeight >= screen.height || window.innerHeight == 0
              ? screen.height
              : window.innerHeight
            : window.innerHeight;
        if (window.devicePixelRatio) {
          wDpr = window.devicePixelRatio;
        } else {
          wDpr = isIOS ? (wWidth > 818 ? 3 : wWidth > 480 ? 2 : 1) : 1; // 手动设置dpr，Android都为1
        }
        // 横屏情况
        if (wWidth > wHeight) {
          wWidth = wHeight;
        }
        wFsize = (wWidth * 10) / 375; // 在375宽度下，1 rem = 10px;
        window.screenWidth_ = wWidth;
        if (isYIXIN || is2345 || ishaosou || isSogou || isLiebao || isGnbr) {
          //YIXIN 和 2345 调用系统浏览器时候的bug，需要一点延迟来获取
          setTimeout(function () {
            wWidth =
              screen.width > 0
                ? window.innerWidth >= screen.width || window.innerWidth == 0
                  ? screen.width
                  : window.innerWidth
                : window.innerWidth;
            wHeight =
              screen.height > 0
                ? window.innerHeight >= screen.height || window.innerHeight == 0
                  ? screen.height
                  : window.innerHeight
                : window.innerHeight;
            wFsize = (wWidth * 10) / 375; // 在375宽度下，1 rem = 10px;
          }, 500);
        }
      }
      resizeRoot();
      document.addEventListener(
        "DOMContentLoaded",
        function (e) {
          if (isMobile(uAgent)) {
            document.getElementsByTagName("html")[0].dataset.dpr = wDpr;
            document.getElementsByTagName("html")[0].style.fontSize = wFsize + "px";
          } else {
            document.getElementsByTagName("html")[0].dataset.dpr = wDpr;
          }
        },
        false
      );
    </script>
